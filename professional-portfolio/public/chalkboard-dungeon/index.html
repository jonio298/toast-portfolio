n Promise.reject(new Error('Fullscreen is not supported by this browser.'))}function update(){var active=!!current();button.textContent=active?'Exit Fullscreen':'Fullscreen';button.setAttribute('aria-pressed',active?'true':'false')}button.addEventListener('click',function(){(current()?exit():request(canvas||document.documentElement)).catch(function(err){console.warn(err)})});document.addEventListener('fullscreenchange',update);document.addEventListener('webkitfullscreenchange',update);update()});</script>
		<style>
html, body, #canvas {
	margin: 0;

body {
	color: white;

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":74760176,"index.wasm":43016933},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const fullscreenButton = document.getElementById('fullscreen-button');
	const canvas = document.getElementById('canvas');

	function fullscreenElement() {
		return document.fullscreenElement || document.webkitFullscreenElement;
	}

	function requestFullscreen(target) {
		if (target.requestFullscreen) {
			return target.requestFullscreen();
		}
		if (target.webkitRequestFullscreen) {
			return target.webkitRequestFullscreen();
		}
		return Promise.reject(new Error('Fullscreen is not supported by this browser.'));
	}

	function exitFullscreen() {
		if (document.exitFullscreen) {
			return document.exitFullscreen();
		}
		if (document.webkitExitFullscreen) {
			document.webkitExitFullscreen();
			return Promise.resolve();
		}
		return Promise.reject(new Error('Fullscreen is not supported by this browser.'));
	}

	function updateFullscreenButton() {
		const active = Boolean(fullscreenElement());
		fullscreenButton.textContent = active ? 'Exit Fullscreen' : 'Fullscreen';
		fullscreenButton.setAttribute('aria-pressed', active ? 'true' : 'false');
	}

	fullscreenButton.addEventListener('click', () => {
		const action = fullscreenElement() ? exitFullscreen() : requestFullscreen(canvas || document.documentElement);
		action.catch((err) => {
			console.warn(err);
		});
	});

	document.addEventListener('fullscreenchange', updateFullscreenButton);
	document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
	updateFullscreenButton();
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
